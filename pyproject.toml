[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "pybind11>=2.10.0",
    "numpy>=1.20.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_particle_tracker"
version = "1.0.0"
description = "High-performance hybrid C++/Python particle tracking system"
authors = [
    {name = "Manish Shukla", email = "manishshukla01@live.com"},
    {name = "R. Maheshwaran"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "cartopy>=0.20.0",
    "tqdm>=4.60.0",
    "pybind11>=2.10.0",
]

[tool.setuptools]
packages = ["hybrid_particle_tracker"]

[tool.setuptools.package-dir]
"hybrid_particle_tracker" = "src/python"
